<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Analyzer</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>CAN Bus Analyzer</h1>
        <div class="subtitle">Real-time CAN data analysis with advanced filtering</div>
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
        <div id="currentProfileDisplay" class="current-profile-display"></div>
    </header>

    <!-- Навигация по вкладкам -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="main">Main</button>
        <button class="tab-btn" data-tab="profiles">Profiles</button>
    </div>

    <!-- Основная вкладка -->
    <div id="main-tab" class="tab-content active">
        <div class="content">
            <!-- Первый ряд: Sender, UDS Sender и Filters -->
            <div class="grid-3">
                <!-- Block 1: CAN Frame Sender -->
                <div class="section">
                    <div class="section-title">
                        <span>CAN Frame Sender</span>
                        <span class="data-points">Frames sent: <span id="sentCount">0</span></span>
                    </div>

                    <div class="form-group">
                        <label for="canId">CAN ID (hex):</label>
                        <input type="text" id="canId" placeholder="0x200" value="0x200">
                    </div>

                    <div class="form-group">
                        <label for="canData">Data (hex bytes, space separated):</label>
                        <input type="text" id="canData" placeholder="01 02 03 04 05 06 07 08">
                    </div>

                    <button onclick="sendCANFrame()">Send CAN Frame</button>
                </div>

                <!-- Block 2: UDS Sender -->
                <div class="section">
                    <div class="section-title">
                        <span>UDS Sender</span>
                        <span class="data-points">Widgets: <span id="udsWidgetCount">0</span></span>
                    </div>

                    <div class="controls-row">
                        <button class="add-btn" onclick="openUDSModal()">Add UDS Widget</button>
                    </div>

                    <div id="udsWidgetsContainer" class="widgets-container uds-widgets-container">
                        <!-- UDS Widgets will be added here dynamically -->
                    </div>
                </div>

                <!-- Block 3: Фильтры CAN ID -->
                <div class="section">
                    <div class="section-title">
                        <span>CAN ID Filters</span>
                        <span class="data-points">Active filters: <span id="filterCount">0</span></span>
                    </div>

                    <div class="controls-row">
                        <input type="text" id="newFilterId" placeholder="0x200 (hex)">
                        <button class="add-btn">Add Filter</button>
                    </div>

                    <div id="filtersContainer" class="filters-container">
                        <!-- Filters will be added here dynamically -->
                    </div>
                </div>
            </div>

            <!-- Block 4: CAN ID Widgets -->
            <div class="section">
                <div class="section-title">
                    <span>CAN ID Widgets</span>
                    <span class="data-points">Widgets: <span id="widgetCount">0</span></span>
                </div>

                <div class="controls-row">
                    <button class="add-btn" id="addWidgetBtn">Add Widget</button>
                </div>

                <div id="widgetsContainer" class="widgets-container">
                    <!-- Widgets will be added here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Вкладка профилей -->
    <div id="profiles-tab" class="tab-content">
        <div class="content">
            <div class="section">
                <div class="section-title">
                    <span>Profiles Management</span>
                    <span class="data-points">Profiles: <span id="profilesCount">0</span></span>
                </div>

                <div class="controls-row">
                    <button class="add-btn" id="createProfileBtn">Create New Profile</button>
                    <button class="toggle-btn" id="refreshProfilesBtn">Refresh List</button>
                </div>

                <div id="profilesContainer" class="profiles-container">
                    <!-- Profiles will be added here dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for widget configuration -->
    <div id="widgetModal" class="modal">
        <!-- ... existing widget modal ... -->
    </div>

    <!-- Modal for profile configuration -->
    <div id="profileModal" class="modal">
        <!-- ... existing profile modal ... -->
    </div>

    <!-- Modal for UDS widget configuration (will be created dynamically) -->

</div>
</body>
</html>
