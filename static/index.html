<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <!--    <link rel="stylesheet" href="widgets.css">-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>CAN Bus Analyzer</h1>
        <div class="subtitle">Real-time CAN data analysis with advanced filtering</div>
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
    </header>

    <div class="content">
        <!-- Первый ряд: Sender и Filters в одном ряду -->
        <div class="grid-2">
            <!-- Block 1: CAN Frame Sender -->
            <div class="section">
                <div class="section-title">
                    <span>CAN Frame Sender</span>
                    <span class="data-points">Frames sent: <span id="sentCount">0</span></span>
                </div>

                <div class="form-group">
                    <label for="canId">CAN ID (hex):</label>
                    <input type="text" id="canId" placeholder="0x200" value="0x200">
                </div>

                <div class="form-group">
                    <label for="canData">Data (hex bytes, space separated):</label>
                    <input type="text" id="canData" placeholder="01 02 03 04 05 06 07 08">
                </div>

                <button onclick="sendCANFrame()">Send CAN Frame</button>
            </div>

            <!-- Block 2: Фильтры CAN ID -->
            <div class="section">
                <div class="section-title">
                    <span>CAN ID Filters</span>
                    <span class="data-points">Active filters: <span id="filterCount">0</span></span>
                </div>

                <div class="controls-row">
                    <input type="text" id="newFilterId" placeholder="0x200 (hex)">
                    <button class="add-btn">Add Filter</button>
                </div>

                <div id="filtersContainer" class="filters-container">
                    <!-- Filters will be added here dynamically -->
                </div>
            </div>
        </div>
        <!-- Block 3: CAN ID Widgets -->
        <div class="section">
            <div class="section-title">
                <span>CAN ID Widgets</span>
                <span class="data-points">Widgets: <span id="widgetCount">0</span></span>
            </div>

            <div class="controls-row">
                <button class="add-btn" id="addWidgetBtn">Add Widget</button>
            </div>

            <div id="widgetsContainer" class="widgets-container">
                <!-- Widgets will be added here dynamically -->
            </div>
        </div>
    </div>



    <!-- Modal for widget configuration -->
    <div id="widgetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Widget Configuration</h3>
                <span class="modal-close">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="modalWidgetId">Widget ID:</label>
                    <input type="text" id="modalWidgetId" placeholder="widget-1">
                </div>
                <div class="form-group">
                    <label for="modalCanId">CAN ID (hex):</label>
                    <input type="text" id="modalCanId" placeholder="0x200">
                </div>
                <div class="form-group">
                    <label for="modalWidgetType">Widget Type:</label>
                    <select id="modalWidgetType">
                        <option value="canChart">Single Chart</option>
                        <option value="canChart2">Dual Chart</option>
                    </select>
                </div>

                <!-- Single Chart Configuration -->
                <div id="singleChartConfig" class="widget-config-section">
                    <h4>Single Chart Configuration</h4>
                    <div class="byte-inputs">
                        <div class="byte-input">
                            <label>Data Source 1:</label>
                            <input type="text" placeholder="0, 0-1, 0-1(U), 0-3(F,2)">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="singleChartColor">Line Color:</label>
                        <input type="color" id="singleChartColor" value="#ff6384">
                    </div>
                </div>

                <!-- Dual Chart Configuration -->
                <div id="dualChartConfig" class="widget-config-section" style="display: none;">
                    <h4>Dual Chart Configuration</h4>
                    <div class="byte-inputs">
                        <div class="byte-input">
                            <label>Data Source 1:</label>
                            <input type="text" placeholder="0, 0-1, 0-1(U), 0-3(F,2)">
                        </div>
                        <div class="byte-input">
                            <label>Data Source 2:</label>
                            <input type="text" placeholder="2, 2-3, 2-3(U), 4-7(F,2)">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label for="dualChartColor1">Line 1 Color:</label>
                            <input type="color" id="dualChartColor1" value="#ff6384">
                        </div>
                        <div class="form-group">
                            <label for="dualChartColor2">Line 2 Color:</label>
                            <input type="color" id="dualChartColor2" value="#36a2eb">
                        </div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="modalSaveBtn" class="save-btn">Save</button>
                    <button id="modalCancelBtn" class="cancel-btn">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
