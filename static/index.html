<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .status.connected {
            background: rgba(46, 204, 113, 0.3);
        }

        .status.disconnected {
            background: rgba(231, 76, 60, 0.3);
        }

        .content {
            padding: 30px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
            margin-bottom: 20px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }

            .container {
                border-radius: 10px;
            }

            .content {
                padding: 15px;
            }

            .byte-inputs {
                grid-template-columns: repeat(2, 1fr) !important;
            }
        }

        .data-points {
            font-size: 0.9em;
            color: #666;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .connection-controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .connection-controls button {
            flex: 1;
        }

        .byte-display {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .byte-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
        }

        .byte-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .byte-label {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chart-stats {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
            color: #666;
        }

        /* Фильтры */
        .filters-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .filter-can-id {
            font-weight: bold;
            color: #667eea;
        }

        /* Блоки CAN ID */
        .can-id-blocks {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .can-id-block {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #e0e0e0;
        }

        .can-id-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .byte-inputs {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .byte-input {
            display: flex;
            flex-direction: column;
        }

        .byte-input label {
            font-size: 0.8em;
            margin-bottom: 5px;
        }

        .remove-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            padding: 8px 16px;
            width: auto;
        }

        .add-btn {
            background: linear-gradient(135deg, #1dd1a1 0%, #10ac84 100%);
            padding: 8px 16px;
            width: auto;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .color-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            border: 1px solid #ddd;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .mini-chart-container {
            height: 200px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-style: italic;
        }

        .toggle-btn {
            background: #6c757d;
            padding: 8px 16px;
            width: auto;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>CAN Bus Analyzer</h1>
        <div class="subtitle">Real-time CAN data analysis with advanced filtering</div>
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
    </header>

    <div class="content">
        <!-- Block 1: CAN Frame Sender -->
        <div class="section">
            <div class="section-title">
                <span>CAN Frame Sender</span>
                <span class="data-points">Frames sent: <span id="sentCount">0</span></span>
            </div>

            <div class="form-group">
                <label for="canId">CAN ID (hex):</label>
                <input type="text" id="canId" placeholder="0x200" value="0x200">
            </div>

            <div class="form-group">
                <label for="canData">Data (hex bytes, space separated):</label>
                <input type="text" id="canData" placeholder="01 02 03 04 05 06 07 08">
            </div>

            <button onclick="sendCANFrame()">Send CAN Frame</button>

            <div class="connection-controls">
                <button id="connectBtn" onclick="connectWebSocket()">Connect</button>
                <button id="disconnectBtn" onclick="disconnectWebSocket()" disabled>Disconnect</button>
            </div>
        </div>

        <!-- Block 2: Фильтры CAN ID -->
        <div class="section">
            <div class="section-title">
                <span>CAN ID Filters</span>
                <span class="data-points">Active filters: <span id="filterCount">0</span></span>
            </div>

            <div class="controls-row">
                <input type="text" id="newFilterId" placeholder="0x200 (hex)">
                <button class="add-btn" onclick="addFilter()">Add Filter</button>
            </div>

            <div id="filtersContainer" class="filters-container">
                <!-- Filters will be added here dynamically -->
            </div>
        </div>

        <!-- Block 3: Блоки CAN ID с графиками -->
        <div class="section">
            <div class="section-title">
                <span>CAN ID Analysis Blocks</span>
                <span class="data-points">Blocks: <span id="blockCount">0</span></span>
            </div>

            <div class="controls-row">
                <input type="text" id="newBlockId" placeholder="0x200 (hex)">
                <button class="add-btn" onclick="addCanIdBlock()">Add CAN ID Block</button>
            </div>

            <div id="canIdBlocks" class="can-id-blocks">
                <!-- CAN ID blocks will be added here dynamically -->
            </div>
        </div>
    </div>
</div>

<script>
    // WebSocket connection
    let ws = null;
    let isConnected = false;
    let sentCount = 0;

    // Data storage
    const MAX_POINTS = 50;
    const chartColors = [
        'rgba(255, 99, 132, 1)',
        'rgba(54, 162, 235, 1)',
        'rgba(75, 192, 192, 1)',
        'rgba(153, 102, 255, 1)',
        'rgba(255, 159, 64, 1)',
        'rgba(255, 205, 86, 1)',
        'rgba(201, 203, 207, 1)',
        'rgba(0, 200, 83, 1)'
    ];

    // Фильтры
    let filters = new Set();
    let canIdBlocks = new Map(); // Map<canId, BlockData>

    // Initialize
    function init() {
        loadFromLocalStorage();
        updateFilterDisplay();
        renderCanIdBlocks();
        initCharts();
    }

    // Local storage
    function loadFromLocalStorage() {
        const savedFilters = localStorage.getItem('canFilters');
        if (savedFilters) {
            try {
                const filterArray = JSON.parse(savedFilters);
                filters = new Set(filterArray);
            } catch (e) {
                console.error('Failed to load filters:', e);
            }
        }

        const savedBlocks = localStorage.getItem('canIdBlocks');
        if (savedBlocks) {
            try {
                const blocks = JSON.parse(savedBlocks);
                canIdBlocks = new Map(Object.entries(blocks));
                // Initialize chart data for each block
                for (const [canId, block] of canIdBlocks) {
                    if (!block.chartData) {
                        block.chartData = {};
                    }
                }
            } catch (e) {
                console.error('Failed to load blocks:', e);
            }
        }
    }

    function saveToLocalStorage() {
        localStorage.setItem('canFilters', JSON.stringify(Array.from(filters)));

        const blocksObj = {};
        canIdBlocks.forEach((value, key) => {
            // Don't save chart data to localStorage
            const saveBlock = { ...value };
            delete saveBlock.chartData;
            blocksObj[key] = saveBlock;
        });
        localStorage.setItem('canIdBlocks', JSON.stringify(blocksObj));
    }

    // Filters management
    function addFilter() {
        const input = document.getElementById('newFilterId');
        const canId = input.value.trim().toLowerCase();

        if (!canId.match(/^0x[0-9a-f]+$/i)) {
            alert('Invalid CAN ID format. Use hex like 0x200');
            return;
        }

        if (filters.has(canId)) {
            alert('Filter already exists');
            return;
        }

        filters.add(canId);
        input.value = '';
        updateFilterDisplay();
        saveToLocalStorage();
    }

    function removeFilter(canId) {
        filters.delete(canId);
        updateFilterDisplay();
        saveToLocalStorage();
    }

    function updateFilterDisplay() {
        const container = document.getElementById('filtersContainer');
        container.innerHTML = '';

        filters.forEach(canId => {
            const filterElement = document.createElement('div');
            filterElement.className = 'filter-item';
            filterElement.innerHTML = `
                    <div class="filter-header">
                        <span class="filter-can-id">${canId}</span>
                        <button class="remove-btn" onclick="removeFilter('${canId}')">×</button>
                    </div>
                    <div class="data-points">
                        Frames: <span id="count-${canId}">0</span>
                    </div>
                `;
            container.appendChild(filterElement);
        });

        document.getElementById('filterCount').textContent = filters.size;
    }

    // CAN ID Blocks management
    function addCanIdBlock() {
        const input = document.getElementById('newBlockId');
        let canId = input.value.trim().toLowerCase();

        if (!canId.match(/^0x[0-9a-f]+$/i)) {
            alert('Invalid CAN ID format. Use hex like 0x200');
            return;
        }

        if (canIdBlocks.has(canId)) {
            alert('Block already exists');
            return;
        }

        // Initialize block configuration
        const blockConfig = {
            canId: canId,
            byteConfigs: Array(8).fill(''), // Empty configs for 8 bytes
            enabled: true,
            chartData: {}, // Will store data for each configured chart
            frameCount: 0
        };

        canIdBlocks.set(canId, blockConfig);
        input.value = '';
        renderCanIdBlocks();
        saveToLocalStorage();
    }

    function removeCanIdBlock(canId) {
        // Clean up chart resources
        const block = canIdBlocks.get(canId);
        if (block) {
            // Destroy any charts
            for (const chartId in block.chartData) {
                if (block.chartData[chartId].chart) {
                    block.chartData[chartId].chart.destroy();
                }
            }
        }

        canIdBlocks.delete(canId);
        renderCanIdBlocks();
        saveToLocalStorage();
    }

    function updateByteConfig(canId, byteIndex, config) {
        const block = canIdBlocks.get(canId);
        if (block) {
            block.byteConfigs[byteIndex] = config.trim();

            // Update chart data structure
            updateChartDataStructure(block);
            renderCanIdBlocks();
            saveToLocalStorage();
        }
    }

    function updateChartDataStructure(block) {
        // Parse all byte configs and create appropriate chart data structures
        const chartKeys = new Set();

        for (let i = 0; i < block.byteConfigs.length; i++) {
            const config = block.byteConfigs[i];
            if (!config) continue;

            const parsed = parseByteConfig(config);
            if (parsed) {
                chartKeys.add(parsed.key);
            }
        }

        // Initialize or cleanup chart data
        for (const key of chartKeys) {
            if (!block.chartData[key]) {
                block.chartData[key] = {
                    labels: [],
                    data: [],
                    chart: null,
                    type: 'byte' // byte, word, float
                };
            }
        }

        // Remove unused chart data
        for (const key in block.chartData) {
            if (!chartKeys.has(key)) {
                if (block.chartData[key].chart) {
                    block.chartData[key].chart.destroy();
                }
                delete block.chartData[key];
            }
        }
    }

    function parseByteConfig(config) {
        // Patterns:
        // "0" -> single byte
        // "2-3(U)" -> unsigned word (bytes 2-3, HiLo)
        // "0-3(F,2)" -> float (bytes 0-3, 2 decimal places)

        const singleBytePattern = /^(\d+)$/;
        const wordPattern = /^(\d+)-(\d+)\(U\)$/i;
        const floatPattern = /^(\d+)-(\d+)\(F,(\d+)\)$/i;

        let match;

        if ((match = config.match(singleBytePattern))) {
            const byteIndex = parseInt(match[1]);
            if (byteIndex >= 0 && byteIndex <= 7) {
                return {
                    type: 'byte',
                    key: `byte${byteIndex}`,
                    byteIndex: byteIndex,
                    decimalPlaces: 0
                };
            }
        } else if ((match = config.match(wordPattern))) {
            const start = parseInt(match[1]);
            const end = parseInt(match[2]);
            if (start >= 0 && end <= 7 && end - start === 1) {
                return {
                    type: 'word',
                    key: `word${start}-${end}`,
                    startByte: Math.min(start, end),
                    endByte: Math.max(start, end),
                    decimalPlaces: 0
                };
            }
        } else if ((match = config.match(floatPattern))) {
            const start = parseInt(match[1]);
            const end = parseInt(match[2]);
            const decimals = parseInt(match[3]);
            if (start >= 0 && end <= 7 && end - start === 3) {
                return {
                    type: 'float',
                    key: `float${start}-${end}`,
                    startByte: Math.min(start, end),
                    endByte: Math.max(start, end),
                    decimalPlaces: decimals
                };
            }
        }

        return null; // Invalid config
    }

    function renderCanIdBlocks() {
        const container = document.getElementById('canIdBlocks');
        container.innerHTML = '';

        canIdBlocks.forEach((block, canId) => {
            const blockElement = document.createElement('div');
            blockElement.className = 'can-id-block';
            blockElement.id = `block-${canId}`;

            let byteInputs = '';
            for (let i = 0; i < 8; i++) {
                byteInputs += `
                        <div class="byte-input">
                            <label>Byte ${i}</label>
                            <input type="text"
                                   value="${block.byteConfigs[i] || ''}"
                                   placeholder="0, 2-3(U), 0-3(F,2)"
                                   onchange="updateByteConfig('${canId}', ${i}, this.value)">
                        </div>
                    `;
            }

            blockElement.innerHTML = `
                    <div class="can-id-header">
                        <div>
                            <span style="font-weight: bold; font-size: 1.2em;">${canId}</span>
                            <span class="data-points" style="margin-left: 10px;">
                                Frames: <span id="frame-count-${canId}">${block.frameCount}</span>
                            </span>
                        </div>
                        <div class="controls-row">
                            <button class="toggle-btn" onclick="toggleBlock('${canId}')">
                                ${block.enabled ? 'Disable' : 'Enable'}
                            </button>
                            <button class="remove-btn" onclick="removeCanIdBlock('${canId}')">Remove</button>
                        </div>
                    </div>

                    <div class="byte-inputs">
                        ${byteInputs}
                    </div>

                    <div class="chart-grid">
                        ${renderChartsForBlock(block)}
                    </div>
                `;

            container.appendChild(blockElement);
        });

        document.getElementById('blockCount').textContent = canIdBlocks.size;

        // Initialize charts for each block
        setTimeout(() => {
            canIdBlocks.forEach((block, canId) => {
                initChartsForBlock(block, canId);
            });
        }, 100);
    }

    function renderChartsForBlock(block) {
        if (Object.keys(block.chartData).length === 0) {
            return '<div class="no-data">No charts configured. Configure byte inputs to display charts.</div>';
        }

        let chartsHTML = '';
        let chartIndex = 0;

        for (const [key, chartData] of Object.entries(block.chartData)) {
            chartsHTML += `
                    <div class="chart-container mini-chart-container">
                        <div class="chart-header">
                            <h4>${getChartTitle(key, chartData.type)}</h4>
                            <div class="chart-stats">
                                <span>Points: ${chartData.data.length}</span>
                                <span id="last-value-${key}">0</span>
                            </div>
                        </div>
                        <canvas id="chart-${block.canId}-${key}"></canvas>
                    </div>
                `;
            chartIndex++;
        }

        return chartsHTML;
    }

    function getChartTitle(key, type) {
        switch (type) {
            case 'byte':
                const byteNum = key.replace('byte', '');
                return `Byte ${byteNum}`;
            case 'word':
                const bytes = key.replace('word', '');
                return `Bytes ${bytes} (U)`;
            case 'float':
                const floatBytes = key.replace('float', '');
                return `Bytes ${floatBytes} (Float)`;
            default:
                return key;
        }
    }

    function initChartsForBlock(block, canId) {
        for (const [key, chartData] of Object.entries(block.chartData)) {
            const canvasId = `chart-${canId}-${key}`;
            const canvas = document.getElementById(canvasId);
            if (!canvas) continue;

            const ctx = canvas.getContext('2d');

            // Destroy existing chart
            if (chartData.chart) {
                chartData.chart.destroy();
            }

            // Create new chart
            chartData.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [{
                        label: key,
                        data: chartData.data,
                        borderColor: chartColors[Object.keys(block.chartData).indexOf(key) % chartColors.length],
                        backgroundColor: 'rgba(0, 0, 0, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: false,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 0 // Disable animation for performance
                    },
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        x: {
                            display: false
                        },
                        y: {
                            display: true,
                            beginAtZero: false,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.1)'
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }
    }

    function toggleBlock(canId) {
        const block = canIdBlocks.get(canId);
        if (block) {
            block.enabled = !block.enabled;
            saveToLocalStorage();
            renderCanIdBlocks();
        }
    }

    // WebSocket functions
    function connectWebSocket() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            return;
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws`;

        ws = new WebSocket(wsUrl);

        ws.onopen = function() {
            isConnected = true;
            updateConnectionStatus(true);
            console.log('WebSocket connected');
        };

        ws.onclose = function() {
            isConnected = false;
            updateConnectionStatus(false);
            console.log('WebSocket disconnected');
        };

        ws.onerror = function(error) {
            console.error('WebSocket error:', error);
            alert('Failed to connect to WebSocket server');
        };

        ws.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            } catch (error) {
                console.error('Failed to parse WebSocket message:', error);
            }
        };
    }

    function disconnectWebSocket() {
        if (ws) {
            ws.close();
            ws = null;
        }
    }

    function updateConnectionStatus(connected) {
        const statusElem = document.getElementById('connectionStatus');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');

        if (connected) {
            statusElem.textContent = 'Connected';
            statusElem.className = 'status connected';
            connectBtn.disabled = true;
            disconnectBtn.disabled = false;
        } else {
            statusElem.textContent = 'Disconnected';
            statusElem.className = 'status disconnected';
            connectBtn.disabled = false;
            disconnectBtn.disabled = true;
        }
    }

    // Handle incoming WebSocket messages
    function handleWebSocketMessage(data) {
        if (data.type === 'can_frame') {
            processCANFrame(data);
        } else if (data.type === 'ack') {
            console.log('ACK received:', data.message);
        }
    }

    // Process CAN frame data
    function processCANFrame(frame) {
        const canId = frame.id.toLowerCase();
        const data = hexToBytes(frame.data);
        const timestamp = new Date().toLocaleTimeString();

        // Update filter counter if this CAN ID is filtered
        if (filters.has(canId)) {
            const countElem = document.getElementById(`count-${canId}`);
            if (countElem) {
                const current = parseInt(countElem.textContent) || 0;
                countElem.textContent = current + 1;
            }
        }

        // Process CAN ID blocks
        const block = canIdBlocks.get(canId);
        if (block && block.enabled) {
            block.frameCount++;
            document.getElementById(`frame-count-${canId}`).textContent = block.frameCount;

            // Process each byte configuration
            for (let i = 0; i < block.byteConfigs.length; i++) {
                const config = block.byteConfigs[i];
                if (!config || data.length <= i) continue;

                const parsedConfig = parseByteConfig(config);
                if (!parsedConfig) continue;

                // Calculate value based on configuration
                let value = 0;

                switch (parsedConfig.type) {
                    case 'byte':
                        if (data.length > parsedConfig.byteIndex) {
                            value = data[parsedConfig.byteIndex];
                        }
                        break;
                    case 'word':
                        if (data.length > parsedConfig.endByte) {
                            value = (data[parsedConfig.startByte] << 8) | data[parsedConfig.endByte];
                        }
                        break;
                    case 'float':
                        if (data.length > parsedConfig.endByte) {
                            // Create a DataView to interpret bytes as float
                            const buffer = new ArrayBuffer(4);
                            const view = new DataView(buffer);
                            // Assuming HiLo byte order
                            view.setUint8(0, data[parsedConfig.startByte]);
                            view.setUint8(1, data[parsedConfig.startByte + 1]);
                            view.setUint8(2, data[parsedConfig.startByte + 2]);
                            view.setUint8(3, data[parsedConfig.startByte + 3]);
                            value = view.getFloat32(0, false); // Big-endian (HiLo)
                            value = parseFloat(value.toFixed(parsedConfig.decimalPlaces));
                        }
                        break;
                }

                // Update chart data
                const chartKey = parsedConfig.key;
                if (!block.chartData[chartKey]) {
                    block.chartData[chartKey] = {
                        labels: [],
                        data: [],
                        chart: null,
                        type: parsedConfig.type
                    };
                }

                const chartData = block.chartData[chartKey];

                // Add new data point
                chartData.labels.push(timestamp);
                chartData.data.push(value);

                // Limit to MAX_POINTS
                if (chartData.labels.length > MAX_POINTS) {
                    chartData.labels.shift();
                    chartData.data.shift();
                }

                // Update last value display
                const lastValueElem = document.getElementById(`last-value-${chartKey}`);
                if (lastValueElem) {
                    lastValueElem.textContent = value.toFixed(parsedConfig.decimalPlaces);
                }

                // Update chart
                if (chartData.chart) {
                    chartData.chart.data.labels = chartData.labels;
                    chartData.chart.data.datasets[0].data = chartData.data;
                    chartData.chart.update('none'); // 'none' for better performance
                }
            }
        }
    }

    // Send CAN frame
    function sendCANFrame() {
        if (!isConnected || !ws) {
            alert('Please connect to WebSocket first');
            return;
        }

        const canId = document.getElementById('canId').value;
        const canData = document.getElementById('canData').value;

        // Validate input
        if (!canId.match(/^0x[0-9A-Fa-f]+$/)) {
            alert('Invalid CAN ID format. Use hex like 0x200');
            return;
        }

        if (!canData.match(/^([0-9A-Fa-f]{2}\s*)+$/)) {
            alert('Invalid data format. Use hex bytes separated by spaces');
            return;
        }

        // Send via WebSocket
        const message = {
            type: 'send_can',
            id: canId,
            data: canData.replace(/\s+/g, '')
        };

        ws.send(JSON.stringify(message));
        sentCount++;
        document.getElementById('sentCount').textContent = sentCount;

        console.log('Sent CAN frame:', message);
    }

    // Utility functions
    function hexToBytes(hex) {
        const bytes = [];
        for (let i = 0; i < hex.length; i += 2) {
            bytes.push(parseInt(hex.substr(i, 2), 16));
        }
        return bytes;
    }

    function bytesToHex(bytes) {
        return bytes.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Initialize charts (legacy function, keeping for compatibility)
    function initCharts() {
        // This is now handled by initChartsForBlock
    }

    // Initialize on load
    window.onload = function() {
        init();
        // Auto-connect after 1 second
        setTimeout(connectWebSocket, 1000);
    };

    // Cleanup on page unload to prevent memory leaks
    window.addEventListener('beforeunload', function() {
        // Clean up all charts
        canIdBlocks.forEach(block => {
            for (const key in block.chartData) {
                if (block.chartData[key].chart) {
                    block.chartData[key].chart.destroy();
                }
            }
        });

        // Close WebSocket
        if (ws) {
            ws.close();
        }
    });

    // Periodically clean up memory
    setInterval(function() {
        // Force garbage collection by creating memory pressure
        if (window.gc) {
            window.gc();
        }

        // Limit the number of stored frames in each chart
        canIdBlocks.forEach(block => {
            for (const key in block.chartData) {
                const chartData = block.chartData[key];
                if (chartData.labels.length > MAX_POINTS * 2) {
                    chartData.labels = chartData.labels.slice(-MAX_POINTS);
                    chartData.data = chartData.data.slice(-MAX_POINTS);
                }
            }
        });
    }, 30000); // Every 30 seconds
</script>
