<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Bus Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1>CAN Bus Analyzer</h1>
        <div class="subtitle">Real-time CAN data analysis with advanced filtering</div>
        <div id="connectionStatus" class="status disconnected">Disconnected</div>
    </header>

    <div class="content">
        <!-- Первый ряд: Sender и Filters в одном ряду -->
        <div class="grid-2">
            <!-- Block 1: CAN Frame Sender -->
            <div class="section">
                <div class="section-title">
                    <span>CAN Frame Sender</span>
                    <span class="data-points">Frames sent: <span id="sentCount">0</span></span>
                </div>

                <div class="form-group">
                    <label for="canId">CAN ID (hex):</label>
                    <input type="text" id="canId" placeholder="0x200" value="0x200">
                </div>

                <div class="form-group">
                    <label for="canData">Data (hex bytes, space separated):</label>
                    <input type="text" id="canData" placeholder="01 02 03 04 05 06 07 08">
                </div>

                <button onclick="sendCANFrame()">Send CAN Frame</button>
            </div>

            <!-- Block 2: Фильтры CAN ID -->
            <div class="section">
                <div class="section-title">
                    <span>CAN ID Filters</span>
                    <span class="data-points">Active filters: <span id="filterCount">0</span></span>
                </div>

                <div class="controls-row">
                    <input type="text" id="newFilterId" placeholder="0x200 (hex)">
                    <button class="add-btn">Add Filter</button>
                </div>

                <div id="filtersContainer" class="filters-container">
                    <!-- Filters will be added here dynamically -->
                </div>
            </div>
        </div>

        <!-- Второй ряд: Блоки виджетов на всю ширину -->
        <div class="section">
            <div class="section-title">
                <span>Widgets</span>
                <span class="data-points">Widgets: <span id="widgetCount">0</span></span>
            </div>

            <div class="controls-row">
                <button id="addWidgetBtn" class="add-btn">Add Widget</button>
            </div>

            <div id="widgetsContainer" class="widgets-container">
                <!-- Widgets will be added here dynamically -->
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно добавления виджета -->
<div id="widgetModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add Widget</h3>
            <span class="close">&times;</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label for="widgetType">Widget Type:</label>
                <select id="widgetType">
                    <option value="canChart">CAN ID Chart</option>
                </select>
            </div>
            <div id="widgetSettings">
                <!-- Настройки для CAN ID Chart -->
                <div class="form-group">
                    <label for="widgetCanId">CAN ID (hex):</label>
                    <input type="text" id="widgetCanId" placeholder="0x200">
                </div>
                <div class="byte-inputs-grid">
                    <input type="text" id="byteConfig0" placeholder="Byte 0 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig1" placeholder="Byte 1 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig2" placeholder="Byte 2 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig3" placeholder="Byte 3 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig4" placeholder="Byte 4 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig5" placeholder="Byte 5 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig6" placeholder="Byte 6 (0, 0-1, 0-1(U), 0-3(F,2))">
                    <input type="text" id="byteConfig7" placeholder="Byte 7 (0, 0-1, 0-1(U), 0-3(F,2))">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button id="saveWidgetBtn" class="add-btn">Add Widget</button>
            <button id="cancelWidgetBtn" class="remove-btn">Cancel</button>
        </div>
    </div>
</div>
</body>
</html>
